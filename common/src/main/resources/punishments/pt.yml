# %check_name% - nome da verificação
# %description% - descrição da verificação
# %vl% - violações
# %verbose% - informação extra
# %player% - nome do jogador
# [alert] - comando especial para alertar
# [webhook] - comando especial para alertar com a webhook do discord
# [proxy] - comando especial para notificar os outros servidores conectados no mesmo proxy (BungeeCord/Velocity)
Punishments:
  Simulation:
    # Depois de quantos segundos a violação deve expirar?
    remove-violations-after: 300
    # Essa sessão combina todas as verificações com os nomes listados abaixo.
    # Para excluir uma verificação que estaria combinada, adicione uma exclamação na frente do nome.
    # Por exemplo: - "!BadPacketsN"
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Limiar: Intervalo entre comandos
    #
    # Exemplo, para expulsar um jogador com a mensagem: "movimento incorreto!" depois de 100 violações, sem
    # repetir o comando:
    # - "100:0 kick %player% movimento incorreto!"
    # 0 significa executar somente uma vez.
    # - "100:50 say %player% está trapaceando!"
    # Executa quando o jogador alcança 100 violações e depois disso a cada 50 violações após as 100.
    #
    commands:
      - "100:40 [alert]"
      - "100:40 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "5:5 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 [alert]"
      - "1:1 [log]"
      - "1:1 [webhook]"
      - "1:1 [proxy]"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "5:3 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 [alert]"
      - "10:5 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 [alert]"
      - "20:40 [log]"
      - "20:40 [webhook]"

  Autoclicker:
      remove-violations-after: 300
      checks:
          - "AutoClicker (A)"
          - "AutoClicker (B)"
          - "AutoClicker (C)"
          - "AutoClicker (F)"
          - "AutoClicker (G)"
          - "1:1 [proxy]"
          - "10:0 kick %player% Vantagem Injusta (AimAssist)"

  AutoclickerX:
      remove-violations-after: 300
      checks:
          - "AutoClicker (D)"
          - "AutoClicker (E)"
      commands:
          - "1:1 [alert]"
          - "1:1 [log]"
          - "1:1 [webhook]"
          - "1:1 [proxy]"
          - "20:0 kick %player% Vantagem Injusta (AimAssist)"

  AimAssist:
      remove-violations-after: 300
      checks:
          - "AimConstant"
          - "AimConsistent"
          - "AimRounding"
          - "AimIR"
          - "AimGCD"
          - "AimSnap"
          - "AimModulo360"
          - "AimDuplicateLook"
      commands:
          - "1:1 [alert]"
          - "1:1 [log]"
          - "1:1 [webhook]"
          - "1:1 [proxy]"
          - "15:0 kick %player% Vantagem Injusta (AimAssist)"

  Killaura:
      remove-violations-after: 300
      checks:
          - "KillAura (Zero)"
          - "Aura (Movement)"
          - "Aura (PostSnap)"
      commands:
          - "1:1 [alert]"
          - "1:1 [log]"
          - "1:1 [webhook]"
          - "1:1 [proxy]"
          - "15:0 kick %player% Vantagem Injusta (AimAssist)"

  Scaffold:
      remove-violations-after: 300
      checks:
          - "Scaffold (Ratio)"
          - "Scaffold (Sync)"
          - "Scaffold (Direction)"
      commands:
          - "1:1 [alert]"
          - "1:1 [log]"
          - "1:1 [webhook]"
          - "1:1 [proxy]"
          - "10:0 kick %player% Vantagem Injusta (AimAssist)"
